spring.application.name=backend

# 接続先の PostgreSQL。環境変数 DB_URL / DB_USERNAME / DB_PASSWORD があればそちらを使う
# （公開先の ECS のタスクで使う）。なければ開発用の DB（../compose.yaml で起動）につなぐ
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booklog}
spring.datasource.username=${DB_USERNAME:booklog}
spring.datasource.password=${DB_PASSWORD:booklog}

# テーブルは Flyway（src/main/resources/db/migration）で作るので、JPA には作らせない
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT（アクセストークン）の署名に使う秘密の値（HS256。32 バイト以上）。
# 公開先では Parameter Store の値を環境変数 JWT_SECRET で渡す。下の既定値は開発用で、公開先では使わない
app.auth.jwt-secret=${JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production}
# Cookie に Secure を付けるか。公開先（HTTPS）では環境変数 COOKIE_SECURE=true にする
app.auth.secure-cookie=${COOKIE_SECURE:false}

# Google Books API（FN-02、技術スタック定義書 3.6）。API キーは開発中は環境変数 GOOGLE_BOOKS_API_KEY、
# 公開先では Parameter Store の値を同じ環境変数で渡す（N-18）。空なら key= を付けずに呼ぶ（README「Google Books API の API キー」）。
# 接続先は E2E（2-1）で偽物のサーバーに向けるときだけ GOOGLE_BOOKS_BASE_URL で変える
app.google-books.base-url=${GOOGLE_BOOKS_BASE_URL:https://www.googleapis.com/books/v1}
app.google-books.api-key=${GOOGLE_BOOKS_API_KEY:}
# 応答をこの時間で打ち切り、使えないものとする（B-8）
app.google-books.timeout=5s

# /actuator/health だけを公開する（公開した後の稼働の確認）。中身の詳しい情報は出さない
management.endpoints.web.exposure.include=health

# API の仕様書（OpenAPI。基本設計書 2.1）。/v3/api-docs と Swagger UI は、公開先では出さない（API の一覧を外に見せないため）。
# 開発中（mvnw spring-boot:run）は dev プロファイル（application-dev.properties）で出す
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.paths-to-match=/api/**
springdoc.writer-with-order-by-keys=true
springdoc.default-produces-media-type=application/json
# multipart の API（写真つきのレビュー。1-6）の @RequestParam を、クエリではなく multipart の項目として書く
springdoc.default-support-form-data=true

# ログ（基本設計書 2.3）。公開先では 1 行 1 つの JSON（ECS 形式）で標準出力に出し、CloudWatch Logs（/bl/app）で項目ごとに探す。
# 開発中（mvnw spring-boot:run）は dev プロファイル（application-dev.properties）で読みやすいテキストに戻す
logging.structured.format.console=ecs
logging.structured.ecs.service.name=booklog
# ログのレベルの閾値：ライブラリも本アプリも INFO 以上を出す
logging.level.root=INFO
logging.level.com.example.booklog=INFO
# この時間以上かかった API のリクエストのログを WARN にする（RequestLogFilter）
app.logging.slow-request-threshold=1s
