# 性能テスト（開発計画書 2-2、基本設計書 2.4）を手元で動かすときの設定。
# jar を java -jar … --spring.profiles.active=perf で起動したときだけ使う（README「性能テスト」）。
# 開発用の DB を性能テストのデータ（ユーザー 1,000 人・レビュー 1 万件など）で埋めないよう、
# 同じ PostgreSQL（compose.yaml の 5432）の中の別の DB booklog_perf につなぐ。ポートは 8080 のまま変えない
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booklog_perf}
