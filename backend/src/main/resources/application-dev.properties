# 開発中だけの設定。mvnw spring-boot:run で起動したときに使う（pom.xml の spring-boot-maven-plugin）。
# 公開用の jar（java -jar）では使わない

# API の仕様書（/v3/api-docs）と Swagger UI（http://localhost:8080/swagger-ui.html）を出す
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# Swagger UI から API を試すとき、Cookie の XSRF-TOKEN を X-XSRF-TOKEN ヘッダーで送り返す（CSRF 対策。機能定義書 3.2）
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ログは JSON ではなくテキストで出す。本アプリのログは DEBUG から出す（基本設計書 2.3）
logging.structured.format.console=
logging.level.com.example.booklog=DEBUG
