# GitHub Actions のランナーの中で、PostgreSQL・S3 の代わりの MinIO・jar（画面も入れたもの）を起動する。
# S3_BUCKET・S3_ENDPOINT・S3_ACCESS_KEY・S3_SECRET_KEY・AWS_ACCESS_KEY_ID・AWS_SECRET_ACCESS_KEY・AWS_REGION・
# GOOGLE_BOOKS_BASE_URL は、呼ぶ側のジョブの env で渡す（API と aws コマンドが読む）。
# E2E（ci.yml）と性能テスト（perf.yml）で使う。先に actions/checkout・setup-java・setup-node と、frontend の npm ci を済ませておく
name: アプリを起動する
description: PostgreSQL・MinIO・jar を起動し、API が応答するまで待つ

inputs:
  profile:
    description: jar を起動するときの Spring のプロファイル（空なら既定。性能テストは perf）
    required: false
    default: ""
  database:
    description: 先に作っておく DB の名前（compose.yaml が作る booklog 以外を使うとき）
    required: false
    default: ""
  log:
    description: API のログを書き出すファイル（リポジトリのルートから）
    required: true

runs:
  using: composite
  steps:
    - name: DB・MinIO を起動する
      shell: bash
      env:
        DATABASE: ${{ inputs.database }}
      run: |
        docker compose up -d db
        # 初回は DB を作る間、TCP では受け付けない一時のサーバーで動くので、TCP でつながるまで待つ
        timeout 60 sh -c 'until docker compose exec -T db pg_isready -q -h 127.0.0.1 -U booklog; do sleep 1; done'
        if [ -n "$DATABASE" ]; then docker compose exec -T db createdb -h 127.0.0.1 -U booklog "$DATABASE"; fi
        # 自動テストと同じ MinIO（TestcontainersConfiguration と同じダイジェスト）
        docker run -d --name minio -p 9000:9000 \
          -e MINIO_ROOT_USER="$S3_ACCESS_KEY" -e MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
          chainguard/minio@sha256:709099319add48dfb44aa596a7070d3ddd8dd04d7ae881765719aec29df9e510 server /data
        timeout 60 sh -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'
        aws s3 mb "s3://$S3_BUCKET" --endpoint-url "$S3_ENDPOINT"

    - name: jar を作って起動する
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        LOG: ${{ inputs.log }}
      run: |
        (cd frontend && npm run build)
        (cd backend && ./mvnw -B -q package -Pwith-frontend -DskipTests)
        # 公開先のタスクのメモリ（1GB。技術スタック定義書 3.4）に収まるヒープの上限
        nohup java -Xmx768m -jar backend/target/backend-0.0.1-SNAPSHOT.jar ${PROFILE:+--spring.profiles.active=$PROFILE} \
          > "$LOG" 2>&1 &
        timeout 120 sh -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 2; done'
