# コードチェックとテストを、Pull Request と main への push ごとに GitHub 上で実行する。
# 手元で同じことをするコマンドは README「テストとコードチェック」
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: 画面（lint・ユニットテスト・型チェック・ビルド）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # API の型（src/api-schema.d.ts）を、API の仕様書（docs/api/openapi.yaml）から作り直して、コミットしたものと同じか確かめる
      - name: API の型が仕様書と同じか
        run: |
          npm run gen:api
          git diff --exit-code src/api-schema.d.ts || { echo "::error::npm run gen:api で作り直した src/api-schema.d.ts をコミットしてください"; exit 1; }
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: API サーバー（書式・静的解析・テスト）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # テスト用の PostgreSQL は Testcontainers が Docker で起動する（ubuntu-latest には Docker が入っている）。
    # API の仕様書（docs/api/openapi.yaml）がコードと違えば、OpenApiExportTests が失敗する
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      # verify で作った jar から、公開先（ECS Fargate）のイメージが作れるか確かめる（push はしない）
      - name: 公開用のイメージを作る
        run: docker build -t bl-app:ci .

  e2e:
    name: E2E（画面を通したテスト）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ランナーの中で PostgreSQL・MinIO（S3 の代わり）・jar を起動し、jar が配る画面（8080）を Edge で操作する。
    # Edge は ubuntu-latest に入っている（channel: msedge）。Google Books API の偽物（9100）は Playwright が起動する
    env:
      E2E_BASE_URL: http://localhost:8080
      GOOGLE_BOOKS_BASE_URL: http://localhost:9100
      S3_BUCKET: bl-photos-e2e
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: e2e-minio
      S3_SECRET_KEY: e2e-minio-secret
      AWS_ACCESS_KEY_ID: e2e-minio
      AWS_SECRET_ACCESS_KEY: e2e-minio-secret
      AWS_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: DB・MinIO・jar を起動する
        uses: ./.github/actions/start-app
        with:
          log: api.log
      - run: npx playwright test
        working-directory: frontend
      # 失敗したテストのトレース（npx playwright show-trace で開く）と、API のログ
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: |
            frontend/test-results/
            api.log
          if-no-files-found: ignore

  requirement-coverage:
    name: 要件 ID とテストの対応（テスト仕様書）
    runs-on: ubuntu-latest
    # テストで確かめる要件 ID にテストがないか、docs/test/requirement-coverage.md を作り直していなければ失敗する
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/requirement-coverage.mjs --check

  terraform:
    name: Terraform（書式・構文・lint）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    # AWS には接続しない（plan・apply は手元で行う。基本設計書 2.2）
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -diff -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --init
        env:
          # プラグインを GitHub から取るときの回数制限を避ける
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --format=compact
