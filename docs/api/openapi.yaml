openapi: 3.1.0
info:
  description: |-
    読書記録アプリ「BookLog」の API。機能ごとの決まりは機能定義書（docs/functions）を見る。

    ## エラーの一覧

    エラーのときは `{"code", "message", "field"}` を返す。message は画面にそのまま出せる文、field があればその入力欄の下に出す。

    | code | HTTP ステータス | message |
    | --- | --- | --- |
    | USERNAME_INVALID | 400 | ユーザー ID は 3〜15 文字の半角英数字と「_」で入力してください。 |
    | USERNAME_TAKEN | 409 | このユーザー ID は使われています。 |
    | PASSWORD_INVALID | 400 | パスワードは英字と数字を含む 8〜64 文字の半角文字で入力してください。 |
    | DISPLAY_NAME_REQUIRED | 400 | 表示名を入力してください。 |
    | LOGIN_FAILED | 401 | ユーザー ID かパスワードが違います。 |
    | LOGIN_LOCKED | 423 | ログインに続けて失敗したため、15 分間ログインできません。 |
    | UNAUTHENTICATED | 401 | ログインの有効期限が切れました。もう一度ログインしてください。 |
    | TOKEN_EXPIRED | 401 | ログインの有効期限が切れました。もう一度ログインしてください。 |
    | REFRESH_FAILED | 401 | ログインの有効期限が切れました。もう一度ログインしてください。 |
    | QUERY_REQUIRED | 400 | ISBN か書名を入力してください。 |
    | BOOK_SEARCH_UNAVAILABLE | 503 | 本の検索がいまできません。時間をおいてもう一度お試しください。 |
    | GOOGLE_BOOK_NOT_FOUND | 404 | この本は見つかりません。 |
    | BOOK_NOT_FOUND | 404 | この本は見つかりません。 |
    | RATING_REQUIRED | 400 | 星を 1〜5 から選んでください。 |
    | BODY_REQUIRED | 400 | 感想を入力してください。 |
    | REVIEW_EXISTS | 409 | この本のレビューはすでに書いています。 |
    | REVIEW_NOT_FOUND | 404 | このレビューは削除されました。 |
    | TOO_MANY_PHOTOS | 400 | 写真は 1 つのレビューに 4 枚までです。 |
    | PHOTO_TOO_LARGE | 413 | 添えられるのは 5MB までの JPEG・PNG・WebP の画像です。 |
    | PHOTO_TYPE_INVALID | 400 | 添えられるのは 5MB までの JPEG・PNG・WebP の画像です。 |
    | PHOTO_UPLOAD_FAILED | 500 | 投稿に失敗しました。時間をおいてもう一度お試しください。 |
    | USER_NOT_FOUND | 404 | このユーザーは見つかりません。 |
    | BAD_REQUEST | 400 | 入力が正しくありません。 |
    | FORBIDDEN | 403 | 操作に失敗しました。時間をおいてもう一度お試しください。 |
    | NOT_FOUND | 404 | 見つかりません。 |
    | INTERNAL_ERROR | 500 | 操作に失敗しました。時間をおいてもう一度お試しください。 |
  title: BookLog API
  version: "1"
servers:
- url: /
security:
- accessToken: []
paths:
  /api/auth/login:
    post:
      description: access_token・refresh_token の Cookie を返す。続けて失敗すると 15 分ロックする（423）
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      security: []
      summary: ログイン
      tags:
      - FN-01 ユーザー登録・ログイン
  /api/auth/logout:
    post:
      description: refresh_token を無効にし、Cookie を消す
      operationId: logout
      parameters:
      - in: cookie
        name: refresh_token
        required: false
        schema:
          type: string
      responses:
        "204":
          description: ログアウトした
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: ログアウト
      tags:
      - FN-01 ユーザー登録・ログイン
  /api/auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: ログインしている自分
      tags:
      - FN-01 ユーザー登録・ログイン
  /api/auth/refresh:
    post:
      description: refresh_token の Cookie で、access_token・refresh_token を取り直す
      operationId: refresh
      parameters:
      - in: cookie
        name: refresh_token
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: 取り直した
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      security: []
      summary: JWT の取り直し
      tags:
      - FN-01 ユーザー登録・ログイン
  /api/auth/signup:
    post:
      description: 登録したらそのままログインし、access_token・refresh_token の Cookie を返す
      operationId: signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          description: 登録した
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      security: []
      summary: ユーザー登録
      tags:
      - FN-01 ユーザー登録・ログイン
  /api/auth/username-availability:
    get:
      operationId: usernameAvailability
      parameters:
      - in: query
        name: username
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameAvailability"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      security: []
      summary: ユーザー ID が使えるか
      tags:
      - FN-01 ユーザー登録・ログイン
  /api/books:
    post:
      description: 検索の結果から選んだ本を取り込み、本の ID を返す。もう取り込んであれば Google Books API を呼ばない
      operationId: importBook
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportBookRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedBook"
          description: もう取り込んであった
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportedBook"
          description: 新しく取り込んだ
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: 本を取り込む
      tags:
      - FN-02 書籍検索・登録
  /api/books/search:
    get:
      description: ISBN か書名・著者名で Google Books API を探す。同じ文字・同じページは 24 時間使い回す。Google
        Books API が使えないとき・その日の上限に達したときは 503
      operationId: search
      parameters:
      - description: ISBN か書名・著者名。前後の空白を除いて 1〜100 文字（B-1・B-2）
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: 1〜5。省いたら 1（B-3）
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSearchPage"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: 本を探す
      tags:
      - FN-02 書籍検索・登録
  /api/books/{bookId}/reviews:
    get:
      description: 新しい順に 20 件ずつ
      operationId: listBookReviews
      parameters:
      - in: path
        name: bookId
        required: true
        schema:
          type: integer
          format: int64
      - description: 前回の nextCursor。最初は省く
        in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: 本のレビューの一覧
      tags:
      - FN-10 本のページ
    post:
      description: 1 人 1 冊に 1 つ（もうあれば 409）。その本が本棚になければ「読了」で入れる。写真は S3 に置いてから保存する
      operationId: createReview
      parameters:
      - in: path
        name: bookId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ReviewForm"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewView"
          description: Created
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: レビューを投稿する
      tags:
      - FN-03 レビュー
  /api/books/{bookId}/status:
    delete:
      description: 自分の本棚から本をなくす。レビューは消さない
      operationId: removeReadingStatus
      parameters:
      - in: path
        name: bookId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: 読書ステータスを外す
      tags:
      - FN-08 読書ステータス・本棚
    put:
      description: 自分の本棚だけ。同じステータスなら並び順を変えない
      operationId: setReadingStatus
      parameters:
      - in: path
        name: bookId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: 読書ステータスを付ける・変える
      tags:
      - FN-08 読書ステータス・本棚
  /api/books/{id}:
    get:
      description: 取り込んだ本の情報と、レビューの平均評価・件数・自分のレビュー。Google Books API は呼ばない
      operationId: detail
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: 本の情報
      tags:
      - FN-10 本のページ
  /api/photos/urls:
    post:
      description: 削除された写真は結果に入らない
      operationId: refreshPhotoUrls
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UrlsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UrlsResponse"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: 写真の署名付き URL を取り直す
      tags:
      - FN-04 写真
  /api/reviews/{id}:
    delete:
      description: 自分のレビューだけ。写真・コメント・参考になったも消え、本と本棚は残る
      operationId: deleteReview
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: レビューを削除する
      tags:
      - FN-03 レビュー
    get:
      operationId: getReview
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewView"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: レビューの詳細
      tags:
      - FN-03 レビュー
    patch:
      description: 自分のレビューだけ。投稿日時・並び順・参考になった・コメントは変わらない。keepPhotoIds にない写真は外して S3
        から消す
      operationId: editReview
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/EditReviewForm"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewView"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: レビューを編集する
      tags:
      - FN-03 レビュー
  /api/timeline:
    get:
      description: following は自分とフォローしている人、all は全員のレビュー。新しい順に 20 件ずつ
      operationId: readTimeline
      parameters:
      - description: following か all（T-1）
        in: query
        name: tab
        required: false
        schema:
          type: string
          enum:
          - following
          - all
      - description: 前回の nextCursor。最初は省く
        in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: タイムライン
      tags:
      - FN-09 タイムライン
  /api/users/{username}/bookshelf:
    get:
      description: ステータスを付けた（変えた）日時の新しい順に 20 冊ずつ。誰の本棚でも見られる
      operationId: listBookshelf
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      - description: WANT・READING・READ のどれか（ST-4）
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - WANT
          - READING
          - READ
      - description: 前回の nextCursor。最初は省く
        in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShelfPage"
          description: OK
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 入力の誤り・ログインが必要・見つからないなど（code は API の説明のエラーの一覧）
        "5XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: 思いがけない失敗
      summary: 本棚の一覧
      tags:
      - FN-08 読書ステータス・本棚
components:
  schemas:
    Author:
      type: object
      properties:
        displayName:
          type: string
        username:
          type: string
      required:
      - displayName
      - username
    BookDetail:
      type: object
      properties:
        authors:
          type: array
          items:
            type: string
        averageRating:
          type:
          - number
          - "null"
          format: double
        description:
          type:
          - string
          - "null"
        id:
          type: integer
          format: int64
        isbn13:
          type:
          - string
          - "null"
        myReviewId:
          type:
          - integer
          - "null"
          format: int64
        myStatus:
          type:
          - string
          - "null"
          enum:
          - WANT
          - READING
          - READ
        publishedDate:
          type:
          - string
          - "null"
        publisher:
          type:
          - string
          - "null"
        reviewCount:
          type: integer
          format: int64
        thumbnailUrl:
          type:
          - string
          - "null"
        title:
          type: string
      required:
      - authors
      - averageRating
      - description
      - id
      - isbn13
      - myReviewId
      - myStatus
      - publishedDate
      - publisher
      - reviewCount
      - thumbnailUrl
      - title
    BookSearchItem:
      type: object
